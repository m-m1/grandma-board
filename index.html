<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מפנים לפני פינוי בינוי</title>
  <style>
    :root {
      --bg: #0f172a;
      --col-bg: #1e293b;
      --card-bg: #334155;
      --text: #f8fafc;
      --accent-room: #38bdf8;
      --accent-member: #34d399;
      --primary: #2563eb;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      overflow-x: auto;
    }

    #authOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .auth-card {
      background: #1e293b;
      border: 1px solid #475569;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .auth-card h2 { margin-top: 0; font-size: 20px; }
    .auth-card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .auth-error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

    h1 { margin: 0 0 6px 0; font-size: 22px; }
    p.subtitle { margin: 0 0 16px 0; color: #94a3b8; font-size: 14px; }
    
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, input, select {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      font-size: 14px;
      background: #1e293b;
      color: #fff;
    }
    button {
      background: var(--primary);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }

    .status-badge {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      background: #334155;
      color: #cbd5e1;
    }

    .board {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      min-height: calc(100vh - 140px);
      padding-bottom: 20px;
    }
    .column {
      background: var(--col-bg);
      border-radius: 12px;
      width: 270px;
      min-width: 270px;
      display: flex;
      flex-direction: column;
      max-height: 85vh;
      border-top: 4px solid var(--accent-room);
    }
    .column.member-col {
      border-top-color: var(--accent-member);
      background: #162436;
    }
    .col-header {
      padding: 12px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .cards-container {
      padding: 10px;
      overflow-y: auto;
      flex-grow: 1;
      min-height: 90px;
    }
    
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: grab;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      border: 1px solid #475569;
    }
    .card:active { cursor: grabbing; }
    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
      background: #1e293b;
    }
    .card-body {
      padding: 10px;
    }
    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .card-title {
      font-weight: 700;
      font-size: 15px;
    }
    .btn-edit {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 4px;
    }
    .btn-edit:hover { background: #475569; color: #fff; }

    .card-dims {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .move-select {
      width: 100%;
      font-size: 12px;
      padding: 5px 6px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
      border-radius: 6px;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 500;
    }
    .modal {
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .modal-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- מסך נעילה -->
  <div id="authOverlay">
    <div class="auth-card">
      <h2>🔒 כניסה למשפחה</h2>
      <p>מפנים לפני פינוי בינוי</p>
      <input type="password" id="passInput" placeholder="הזינו סיסמה..." style="width: 100%; margin-bottom: 12px;">
      <button onclick="checkPassword()" style="width: 100%;">כניסה</button>
      <div id="authError" class="auth-error">הסיסמה שגויה, נסו שוב</div>
    </div>
  </div>

  <!-- לוח ראשי -->
  <h1>📦 מפנים לפני פינוי בינוי</h1>
  <p class="subtitle">גררו פריט לעמודה שלכם (או העבירו מהתפריט בנייד). לשינוי פרטים לחצו על "ערוך".</p>

  <div class="toolbar">
    <button onclick="openAddModal()">➕ הוסף פריט לחדר</button>
    <button style="background: #334155;" onclick="loadFromSheet()">🔄 רענן נתונים</button>
    <span id="syncStatus" class="status-badge">🔄 מתחבר ל-Google Sheets...</span>
  </div>

  <div class="board" id="board"></div>

  <!-- מודל הוספה ועריכה -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3 id="modalHeading" style="margin:0;">הוספת פריט</h3>
      <input type="hidden" id="editItemId">
      
      <label style="font-size:12px; color:#94a3b8;">חדר או מיקום:</label>
      <select id="itemRoom"></select>

      <label style="font-size:12px; color:#94a3b8;">שם הפריט:</label>
      <input type="text" id="itemTitle" placeholder="למשל: שידת עץ">

      <label style="font-size:12px; color:#94a3b8;">מידות והערות:</label>
      <input type="text" id="itemDims" placeholder="למשל: 120/40 ס&quot;מ, מצב מעולה">

      <label style="font-size:12px; color:#94a3b8;">תמונה (אופציונלי):</label>
      <input type="file" id="itemImg" accept="image/*">

      <div class="modal-buttons">
        <button id="btnDelete" style="background: var(--danger); display: none;" onclick="deleteCurrentItem()">🗑️ מחק</button>
        <div style="display: flex; gap: 8px; margin-right: auto;">
          <button style="background:#64748b;" onclick="closeModal()">ביטול</button>
          <button onclick="saveItemHandler()">שמור</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. סיסמה משפחתית
    // ==========================================
    const FAMILY_PASSWORD = "galila";

    // ==========================================
    // 2. קישור ה-Apps Script שהעתקת משלב 2
    // הדביקי את הקישור במקום הטקסט כאן:
    // ==========================================
   const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMSd14pmZRyBA0fwTF9f8Dkd6sg-YWudIVrMn8Az-33Y1Pm_cWKrONzZpzSQ0vkBm0/exec";

    function checkAuth() {
      if (localStorage.getItem('grandma_auth') === 'valid') {
        document.getElementById('authOverlay').style.display = 'none';
      }
    }
    function checkPassword() {
      const val = document.getElementById('passInput').value.trim();
      if (val === FAMILY_PASSWORD) {
        localStorage.setItem('grandma_auth', 'valid');
        document.getElementById('authOverlay').style.display = 'none';
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }
    document.getElementById('passInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkPassword();
    });
    checkAuth();

    const defaultRooms = ["סלון", "מטבח", "חדר שינה", "חדר עבודה", "חדר כביסה", "חדר שקיות", "מרפסת", "שירותים ומקלחת", "שונות"];
    const memberColumns = [
      "הדברים של רוני ונעמי",
      "הדברים של מיכל",
      "הדברים של רז ובר",
      "הדברים של גל",
      "הדברים של שיר",
      "הדברים של ליאור",
      "הדברים של מאי"
    ];

    let items = [];
    let currentImgBase64 = "";

    function loadFromSheet() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE")) {
        document.getElementById('syncStatus').textContent = "⚠️ נא להדביק את כתובת ה-Apps Script בקוד";
        return;
      }
      document.getElementById('syncStatus').textContent = "🔄 טוען נתונים...";
      fetch(GOOGLE_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          items = data.items || [];
          document.getElementById('syncStatus').textContent = "🟢 מסונכרן מול Google Sheets";
          renderBoard();
        })
        .catch(err => {
          console.error(err);
          document.getElementById('syncStatus').textContent = "🔴 שגיאה בטעינה מהגיליון";
        });
    }

    function sendActionToSheet(payload) {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE")) return;
      document.getElementById('syncStatus').textContent = "💾 שומר בגיליון...";
      
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('syncStatus').textContent = "🟢 מסונכרן מול Google Sheets";
      })
      .catch(err => {
        console.error(err);
        document.getElementById('syncStatus').textContent = "🔴 שגיאה בשמירה";
      });
    }

    document.getElementById('itemImg').addEventListener('change', function() {
      if (this.files && this.files[0]) {
        const file = this.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 450;
            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            currentImgBase64 = canvas.toDataURL('image/jpeg', 0.6);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function getAllColumns() {
      return [...defaultRooms, ...memberColumns];
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const allCols = getAllColumns();

      defaultRooms.forEach(room => createColElement(room, false));
      memberColumns.forEach(mem => createColElement(mem, true));

      items.forEach(item => {
        const colContainer = document.getElementById(`cards-${item.col}`);
        if (colContainer) {
          const card = document.createElement('div');
          card.className = 'card';
          card.draggable = true;
          card.id = `item-${item.id}`;
          card.ondragstart = (e) => e.dataTransfer.setData('text/plain', item.id);

          const selectOptions = allCols.map(c => 
            `<option value="${c}" ${c === item.col ? 'selected' : ''}>${c}</option>`
          ).join('');

          card.innerHTML = `
            ${item.img ? `<img src="${item.img}" alt="${item.title}">` : ''}
            <div class="card-body">
              <div class="card-header-row">
                <div class="card-title">${item.title}</div>
                <button class="btn-edit" onclick="openEditModal('${item.id}')">✏️ ערוך</button>
              </div>
              ${item.dims ? `<div class="card-dims">📏 ${item.dims}</div>` : ''}
              <select class="move-select" onchange="moveItem('${item.id}', this.value)">
                <option value="" disabled>העבר אל...</option>
                ${selectOptions}
              </select>
            </div>
          `;
          colContainer.appendChild(card);
        }
      });
    }

    function createColElement(name, isMember) {
      const col = document.createElement('div');
      col.className = `column ${isMember ? 'member-col' : ''}`;
      col.innerHTML = `
        <div class="col-header">
          <span>${isMember ? '👤 ' : '🏠 '}${name}</span>
        </div>
        <div class="cards-container" id="cards-${name}"></div>
      `;

      const container = col.querySelector('.cards-container');
      container.ondragover = (e) => e.preventDefault();
      container.ondrop = (e) => {
        e.preventDefault();
        const itemId = e.dataTransfer.getData('text/plain');
        moveItem(itemId, name);
      };

      document.getElementById('board').appendChild(col);
    }

    function moveItem(itemId, targetCol) {
      const item = items.find(i => i.id === itemId);
      if (item && item.col !== targetCol) {
        item.col = targetCol;
        renderBoard();
        sendActionToSheet({ action: 'move', id: itemId, toCol: targetCol });
      }
    }

    function openAddModal() {
      document.getElementById('modalHeading').textContent = "הוספת פריט חדש";
      document.getElementById('editItemId').value = "";
      document.getElementById('itemTitle').value = "";
      document.getElementById('itemDims').value = "";
      document.getElementById('itemImg').value = "";
      document.getElementById('btnDelete').style.display = "none";
      currentImgBase64 = "";

      const select = document.getElementById('itemRoom');
      select.innerHTML = getAllColumns().map(r => `<option value="${r}">${r}</option>`).join('');
      document.getElementById('modal').style.display = 'flex';
    }

    function openEditModal(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modalHeading').textContent = "עריכת פריט";
      document.getElementById('editItemId').value = item.id;
      document.getElementById('itemTitle').value = item.title;
      document.getElementById('itemDims').value = item.dims;
      document.getElementById('itemImg').value = "";
      document.getElementById('btnDelete').style.display = "block";
      currentImgBase64 = item.img || "";

      const select = document.getElementById('itemRoom');
      select.innerHTML = getAllColumns().map(r => 
        `<option value="${r}" ${r === item.col ? 'selected' : ''}>${r}</option>`
      ).join('');

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function saveItemHandler() {
      const title = document.getElementById('itemTitle').value.trim();
      if (!title) return alert('נא להזין שם לפריט');

      const editId = document.getElementById('editItemId').value;
      const targetCol = document.getElementById('itemRoom').value;
      const dims = document.getElementById('itemDims').value.trim();

      if (editId) {
        const item = items.find(i => i.id === editId);
        if (item) {
          item.title = title;
          item.dims = dims;
          item.col = targetCol;
          if (currentImgBase64) item.img = currentImgBase64;
          renderBoard();
          sendActionToSheet({ action: 'update', item: item });
        }
      } else {
        const newItem = {
          id: Date.now().toString(),
          col: targetCol,
          title: title,
          dims: dims,
          img: currentImgBase64
        };
        items.push(newItem);
        renderBoard();
        sendActionToSheet({ action: 'add', item: newItem });
      }

      closeModal();
    }

    function deleteCurrentItem() {
      const editId = document.getElementById('editItemId').value;
      if (!editId) return;

      if (confirm("האם למחוק פריט זה לצמיתות?")) {
        items = items.filter(i => i.id !== editId);
        renderBoard();
        sendActionToSheet({ action: 'delete', id: editId });
        closeModal();
      }
    }

    loadFromSheet();
    setInterval(loadFromSheet, 20000);
  </script>
</body>
</html>
